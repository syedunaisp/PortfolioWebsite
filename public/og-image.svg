<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0d1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bc13fe;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Grid pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="630" /><line x1="80" y1="0" x2="80" y2="630" />
    <line x1="160" y1="0" x2="160" y2="630" /><line x1="240" y1="0" x2="240" y2="630" />
    <line x1="320" y1="0" x2="320" y2="630" /><line x1="400" y1="0" x2="400" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" /><line x1="560" y1="0" x2="560" y2="630" />
    <line x1="640" y1="0" x2="640" y2="630" /><line x1="720" y1="0" x2="720" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" /><line x1="880" y1="0" x2="880" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" /><line x1="1040" y1="0" x2="1040" y2="630" />
    <line x1="1120" y1="0" x2="1120" y2="630" /><line x1="1200" y1="0" x2="1200" y2="630" />
    <line x1="0" y1="0" x2="1200" y2="0" /><line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" /><line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" /><line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="480" x2="1200" y2="480" /><line x1="0" y1="560" x2="1200" y2="560" />
    <line x1="0" y1="630" x2="1200" y2="630" />
  </g>

  <!-- Glow orbs -->
  <circle cx="200" cy="315" r="300" fill="#bc13fe" opacity="0.06" />
  <circle cx="1000" cy="315" r="300" fill="#00d9ff" opacity="0.06" />

  <!-- Accent bar -->
  <rect x="80" y="260" width="6" height="130" fill="url(#accent)" rx="3" />

  <!-- Name -->
  <text x="116" y="320" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="72" fill="#ffffff" letter-spacing="-2">Syed Unais Panjathan</text>

  <!-- Title -->
  <text x="116" y="378" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="32" fill="#00d9ff">AI Engineer &amp; Machine Learning Developer</text>

  <!-- Subtitle tags -->
  <rect x="116" y="420" width="210" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#00d9ff" stroke-width="1" stroke-opacity="0.3" />
  <text x="221" y="446" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#aaaaaa" text-anchor="middle">Generative AI</text>

  <rect x="344" y="420" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#bc13fe" stroke-width="1" stroke-opacity="0.3" />
  <text x="419" y="446" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#aaaaaa" text-anchor="middle">LLM Apps</text>

  <rect x="512" y="420" width="130" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#00d9ff" stroke-width="1" stroke-opacity="0.3" />
  <text x="577" y="446" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#aaaaaa" text-anchor="middle">MLOps</text>

  <!-- URL -->
  <text x="116" y="560" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#555555">unais.vercel.app</text>
</svg>
